name: 'Download deplibs posix'
description: 'Download deplibs posix'

inputs:
  basedir:
     description: 'base dir'
     required: true

runs:
  using: "composite"
  steps:

  - name: Download deplibs
    shell: bash
    run: |
      if [[ "$RUNNER_OS" == "Windows" ]]; then
        GITHUB_WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE")
        BASEDIR=$(cygpath -u "${{ inputs.basedir }}")
      else
        BASEDIR=${{ inputs.basedir }}
      fi

      cd ${GITHUB_WORKSPACE}
      bash build_scripts/download_deplibs/run.sh $BASEDIR ${{ runner.os }} ${{ runner.arch }}

  # The tarball comes from the third-party source mirror in CueMol/build_scripts
  # rather than ftp.gnu.org, which is frequently unreachable and used to take the
  # whole macOS matrix down with it.
  - name: Install autoconf 2.13 (macOS)
    if: ${{ runner.os == 'macOS' }}
    shell: bash
    run: |
      set -eux
      . "${GITHUB_WORKSPACE}/build_scripts/deplibs.env"
      TGZ="autoconf-${AUTOCONF213_VER}.tar.gz"
      cd "${RUNNER_TEMP}"
      curl -fsSL --retry 3 --connect-timeout 20 -o "$TGZ" "${THIRDPARTY_MIRROR_URL}/${TGZ}"
      echo "${AUTOCONF213_SHA256}  $TGZ" | shasum -a 256 -c -
      tar xzf "$TGZ"
      cd "autoconf-${AUTOCONF213_VER}"
      ./configure --prefix=$HOME/autoconf-${AUTOCONF213_VER} --program-suffix=213
      make
      make install
      echo "$HOME/autoconf-${AUTOCONF213_VER}/bin" >> $GITHUB_PATH

  - name: Check autoconf 2.13 (macOS)
    if: ${{ runner.os == 'macOS' }}
    shell: bash
    run: |
      which autoconf213
      autoconf213 --version

  - name: Download python-build-standalone (macOS)
    if: ${{ runner.os == 'macOS' && env.EMBED_PYTHON != '' }}
    shell: bash
    run: |
      echo "Download python-build-standalone $EMBED_PYTHON"
      BASEDIR=${{ inputs.basedir }}
      cd $BASEDIR

      URL_BASE="https://github.com/astral-sh/python-build-standalone/releases/download"
      DATE="20251217"
      ARCH="aarch64"
      OS="apple-darwin"
      PYTHON_VER="3.12.12"
      TGZ_FILE="cpython-${PYTHON_VER}+${DATE}-${ARCH}-${OS}-install_only_stripped.tar.gz"
      URL="${URL_BASE}/${DATE}/${TGZ_FILE}"
      curl -sS -L -O $URL
      tar xjf $TGZ_FILE
      
      rm $TGZ_FILE
      echo "EMBED_PYTHON_ROOT=$BASEDIR/python" >> $GITHUB_ENV
      ls -la

