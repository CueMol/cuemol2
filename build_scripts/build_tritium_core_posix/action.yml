name: 'Build tritium/core addon'
description: 'Build tritium/core addon'

inputs:
  basedir:
     description: 'base dir'
     required: true

runs:
  using: "composite"
  steps:
  - name: Build tritium/core addon (posix)
    if: runner.os != 'Windows'
    shell: bash
    run: |
      cd ${GITHUB_WORKSPACE}
      bash build_scripts/build_tritium_core_posix/run.sh ${{ inputs.basedir }}

  - name: Build tritium/core addon (windows)
    if: runner.os == 'Windows'
    shell: cmd
    run: |
      echo on
      cd %GITHUB_WORKSPACE%
      call build_scripts\build_tritium_core_posix\run_win.bat ${{ inputs.basedir }}
      if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
