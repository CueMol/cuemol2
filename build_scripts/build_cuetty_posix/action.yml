name: 'Build cuetty posix'
description: 'Build cuetty posix'

inputs:
  basedir:
     description: 'base dir'
     required: true

runs:
  using: "composite"
  steps:
  - name: Build and install cuetty (posix)
    if: runner.os != 'Windows'
    shell: bash
    env:
      SCCACHE_GHA_ENABLED: "true"
    run: |
      BASEDIR=${{ inputs.basedir }}

      cd ${GITHUB_WORKSPACE}
      bash build_scripts/build_cuetty_posix/run.sh $BASEDIR

      ls -la $BASEDIR/cuemol2/bin/cuetty
      $BASEDIR/cuemol2/bin/cuetty

  # - name: Check cuetty run
  #   shell: bash
  #   if: runner.os != 'Windows'
  #   run: |
  #     set -eux
  #     BASEDIR=${{ inputs.basedir }}

  - name: Build and install cuetty (windows)
    if: runner.os == 'Windows'
#    shell: bash
#    env:
#      SCCACHE_GHA_ENABLED: "true"
    shell: cmd
    run: |
      echo on
      cd %GITHUB_WORKSPACE%
      set HOME=%HOMEDRIVE%%HOMEPATH%
      cmd /c build_scripts\build_cuetty_posix\run_win.bat ${{ inputs.basedir }}
      REM check run
      %BASEDIR%\cuemol2\bin\cuetty.exe
