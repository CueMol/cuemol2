# https://taskfile.dev

version: '3'

vars:
  # Shared, branch-independent downloaded deps (boost/CGAL/fftw/glew/lcms2/python).
  WORKDIR: '{{if eq OS "windows"}}c:\tmp\proj64_deplibs{{else}}$HOME/tmp/proj64_deplibs{{end}}'
  # Per-checkout build/install output, so multiple checkouts/worktrees on the same
  # host do not clobber each other.
  OUTDIR: '{{.ROOT_DIR}}/../.build_out'
  LIBCUEMOL2_BUILDDIR: "{{.OUTDIR}}/build_libcuemol2"
  LIBCUEMOL2_INSTDIR: "{{.OUTDIR}}/cuemol2"
  CONFIG: '{{if eq OS "windows"}}Release{{else}}Debug{{end}}'
  PARALLEL: ""
  EMBED_PYTHON_ROOT:
    sh: '[ -d "{{.WORKDIR}}/python" ] && echo "{{.WORKDIR}}/python" || echo ""'

tasks:
  default:
    cmds:
      - echo "Default workdir {{.WORKDIR}}"
    silent: true

  #####

  download_deplibs:
    desc: "Download dependent library"
    deps:
      - task: download_deplibs:{{OS}}

  download_deplibs:darwin:
    cmds:
      - bash download_deplibs/run.sh "{{.WORKDIR}}" macOS ARM64

  download_deplibs:linux:
    cmds:
      - bash download_deplibs/run.sh "{{.WORKDIR}}" Linux X64

  #####

  download_extpkgs:
    cmds:
      - bash download_extpkgs/run.sh "{{.WORKDIR}}" macOS ARM64

  #####

  rebuild_libcuemol2:
    desc: "Config & Rebuild libcuemol2"
    deps:
      - task: rebuild_libcuemol2:{{OS}}

  rebuild_libcuemol2:darwin:
    platforms: [darwin]
    env:
      EMBED_PYTHON_ROOT: '{{.EMBED_PYTHON_ROOT | default (env "EMBED_PYTHON_ROOT")}}'
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - bash build_libcuemol2_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  rebuild_libcuemol2:linux:
    platforms: [linux]
    env:
      EMBED_PYTHON_ROOT: '{{.EMBED_PYTHON_ROOT | default (env "EMBED_PYTHON_ROOT")}}'
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - bash build_libcuemol2_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  rebuild_libcuemol2:windows:
    platforms: [windows]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - bash build_libcuemol2_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  build_libcuemol2:
    desc: "Build libcuemol2 (using current config)"
    deps:
      - task: build_libcuemol2:{{OS}}

  build_libcuemol2:darwin:
    desc: "Rebuild libcuemol2 (without running setup/config)"
    platforms: [darwin]
    cmds:
      - cmake --build "{{.LIBCUEMOL2_BUILDDIR}}" --parallel "{{.PARALLEL}}" --config "{{.CONFIG}}" --target install

  build_libcuemol2:linux:
    desc: "Rebuild libcuemol2 (without running setup/config)"
    platforms: [linux]
    cmds:
      - cmake --build "{{.LIBCUEMOL2_BUILDDIR}}" --parallel "{{.PARALLEL}}" --config "{{.CONFIG}}" --target install

  build_libcuemol2:windows:
    platforms: [windows]
    cmds:
      - cmake --build "{{.LIBCUEMOL2_BUILDDIR}}" --parallel "{{.PARALLEL}}" --config "{{.CONFIG}}" --target install

  run_gtest:
    desc: "Run C++ unit tests (ctest). TEST=<binary> filters by label (e.g. test_qlib), FILTER=<regex> filters by test name."
    vars:
      TEST: '{{default "" .TEST}}'
      FILTER: '{{default "" .FILTER}}'
    cmds:
      - ctest --test-dir "{{.LIBCUEMOL2_BUILDDIR}}" --output-on-failure{{if .TEST}} -L "{{.TEST}}"{{end}}{{if .FILTER}} -R "{{.FILTER}}"{{end}}

  clean_libcuemol2:
    desc: "Clean up the libcuemol2 obj dir"
    cmds:
      - rm -rf "{{.LIBCUEMOL2_BUILDDIR}}"
      - rm -rf "{{.LIBCUEMOL2_INSTDIR}}"

  clean_shaders:
    desc: "Clean up the libcuemol2 shader files"
    cmds:
      - find "{{.LIBCUEMOL2_BUILDDIR}}" -name "*.glsl" | xargs rm
      - find "{{.LIBCUEMOL2_INSTDIR}}" -name "*.glsl" | xargs rm

#####

  build_pytest:
    deps:
      - task: build_pytest:{{OS}}

  build_pytest:darwin:
    platforms: [darwin]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - task: build_libcuemol2
      - bash build_pymod_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

#####

  build_tritium_core:
    desc: "Build tritium/core native addon (test via test_tritium_core)"
    deps:
      - task: build_tritium_core:{{OS}}

  build_tritium_core:darwin:
    platforms: [darwin]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - task: build_libcuemol2
      - bash build_tritium_core_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  build_tritium_core:linux:
    platforms: [linux]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - task: build_libcuemol2
      - bash build_tritium_core_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  build_tritium_core:windows:
    platforms: [windows]
    cmds:
      - task: build_libcuemol2
      - cmd /c build_tritium_core_posix\\run_win.bat "{{.WORKDIR}}"

#####

  build_cli:
    deps:
      - task: build_cli:{{OS}}

  build_cli:darwin:
    platforms: [darwin]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - task: build_libcuemol2
      - bash build_cuetty_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  run_cli:
    platforms: [darwin]
    cmds:
      # - task: build_cli
      - env LD_LIBRARY_PATH="{{.LIBCUEMOL2_INSTDIR}}/lib" "{{.LIBCUEMOL2_INSTDIR}}/bin/cuetty" -i

#####

  build_tritium:
    desc: "Build tritium (Electron+React GUI app)"
    deps:
      - task: build_tritium:{{OS}}

  build_tritium:darwin:
    platforms: [darwin]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - task: build_libcuemol2
      - bash build_tritium_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  build_tritium:linux:
    platforms: [linux]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - task: build_libcuemol2
      - bash build_tritium_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  build_tritium:windows:
    platforms: [windows]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - task: build_libcuemol2
      - bash build_tritium_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  clean_tritium:
    desc: "Clean tritium build artifacts (core native addon + react-gui out)"
    cmds:
      - rm -rf "{{.ROOT_DIR}}/../tritium/core/build"
      - rm -rf "{{.ROOT_DIR}}/../tritium/react-gui/out"

  rebuild_tritium:
    desc: "Clean tritium/core build artifacts and rebuild tritium from scratch"
    cmds:
      - task: clean_tritium
      - task: build_tritium

  run_tritium:
    desc: "Run the built tritium Electron app"
    dir: "{{.ROOT_DIR}}/../tritium/react-gui"
    cmds:
      - pnpm run start

  package_tritium:
    desc: "Package the tritium app into a distributable (macOS arm64 DMG)"
    deps:
      - task: package_tritium:{{OS}}

  package_tritium:darwin:
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}/../tritium/react-gui"
    env:
      # Default install prefix used by the build tasks; collect-cuemol2-runtime.sh
      # also defaults to this, but set it explicitly so the env contract is clear.
      LIBCUEMOL2_ROOT: "{{.LIBCUEMOL2_INSTDIR}}"
    cmds:
      - pnpm run package:mac

  lint_tritium_style:
    desc: "Lint react-gui CSS for raw hex/px outside the design tokens (warn-only; not wired into build_tritium)"
    dir: "{{.ROOT_DIR}}/../tritium/react-gui"
    cmds:
      - pnpm run lint:style

  lint_tritium_comments:
    desc: "Lint react-gui TS comments for disallowed non-ASCII glyphs (box-drawing/arrows/etc); fails on reintroduction"
    dir: "{{.ROOT_DIR}}/../tritium/react-gui"
    cmds:
      - pnpm run lint:comments

  test_tritium:
    desc: "Run tritium tests (core Jest + react-gui Vitest)"
    cmds:
      - task: test_tritium_core
      - task: test_tritium_react_gui

  test_tritium_core:
    desc: "Run tritium/core Jest tests (Node pinned via tritium/.nvmrc)"
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      # Delegate to the same script CI uses (test_tritium_core_posix/run.sh); the
      # Taskfile only layers the local Node pin (nvm) so there is one core-test source.
      - bash -c 'set -e; export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"; . "$NVM_DIR/nvm.sh"; cd "{{.ROOT_DIR}}/../tritium"; nvm use >/dev/null; bash "{{.ROOT_DIR}}/test_tritium_core_posix/run.sh" "{{.WORKDIR}}"'

  test_tritium_react_gui:
    desc: "Run tritium/react-gui Vitest tests (Node pinned via tritium/.nvmrc)"
    dir: "{{.ROOT_DIR}}/../tritium/react-gui"
    cmds:
      - bash -c 'set -e; export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"; . "$NVM_DIR/nvm.sh"; nvm use; pnpm test'

#####

  rebuild_uxpgui:
    desc: "Setup, config, and build the uxpgui app"
    platforms: [darwin]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - bash build_uxpgui_posix/run.sh "{{.WORKDIR}}" macOS ARM64

  build_uxpgui:
    desc: "Build the uxpgui app (without running setup/config)"
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}/../uxp_gui/"
    cmds:
      - ./mach build

  run_uxpgui:
    desc: "Run the built uxpgui app"
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}/../uxp_gui/"
    cmds:
      - ./obj-aarch64-apple-darwin/dist/CueMol2.app/Contents/MacOS/cuemol2

  clean_uxpgui:
    desc: "Clean up uxpgui obj dir"
    cmds:
      - rm -rf "{{.ROOT_DIR}}/../uxp_gui/obj-*"

#####

  uxpgui:
    desc: "Build libcuemol2 and uxp and run the built app"
    platforms: [darwin]
    cmds:
      - task: build_libcuemol2
      - task: build_uxpgui
      - task: run_uxpgui
