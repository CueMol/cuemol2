# https://taskfile.dev

version: '3'

vars:
  # Shared, branch-independent downloaded deps (boost/CGAL/fftw/glew/lcms2/python).
  WORKDIR: '{{if eq OS "windows"}}c:\tmp\proj64_deplibs{{else}}$HOME/tmp/proj64_deplibs{{end}}'
  # Per-checkout build/install output, so multiple checkouts/worktrees on the same
  # host do not clobber each other.
  OUTDIR: '{{.ROOT_DIR}}/../.build_out'
  LIBCUEMOL2_BUILDDIR: "{{.OUTDIR}}/build_libcuemol2"
  LIBCUEMOL2_INSTDIR: "{{.OUTDIR}}/cuemol2"
  CONFIG: '{{if eq OS "windows"}}Release{{else}}Debug{{end}}'
  PARALLEL: ""
  EMBED_PYTHON_ROOT:
    sh: '[ -d "{{.WORKDIR}}/python" ] && echo "{{.WORKDIR}}/python" || echo ""'

tasks:
  default:
    cmds:
      - echo "Default workdir {{.WORKDIR}}"
    silent: true

  #####

  download_deplibs:
    desc: "Download dependent library"
    deps:
      - task: download_deplibs:{{OS}}

  download_deplibs:darwin:
    cmds:
      - bash download_deplibs/run.sh "{{.WORKDIR}}" macOS ARM64

  download_deplibs:linux:
    cmds:
      - bash download_deplibs/run.sh "{{.WORKDIR}}" Linux X64

  download_deplibs:windows:
    platforms: [windows]
    # Mirrors the build_win_x64 job in .github/workflows/build2.yml, which uses the
    # same download_deplibs composite action as posix: it calls run.sh with
    # "Windows X64" and cygpath-normalizes basedir first. run.sh does not normalize
    # its BASEDIR arg, and WORKDIR is a native "c:\..." path on Windows, so pass it
    # through cygpath -u here.
    cmds:
      - bash -c 'bash download_deplibs/run.sh "$(cygpath -u "{{.WORKDIR}}")" Windows X64'

  #####

  download_extpkgs:
    cmds:
      - bash download_extpkgs/run.sh "{{.WORKDIR}}" macOS ARM64

  install_umbreon:
    desc: "Build+install umbreon into the deplibs prefix (override source dir with UMBREON_SRC=...)"
    vars:
      # umbreon is checked out parallel to the cuemol2 repo, so derive the default
      # from ROOT_DIR (<repo>/build_scripts) instead of $HOME: $HOME does not locate
      # the checkout on Windows, where the repo is not under the home dir. run.sh
      # cygpath-normalizes this arg, so a mixed "c:\...\build_scripts/../../umbreon"
      # path resolves fine.
      UMBREON_SRC: '{{.UMBREON_SRC | default (printf "%s/../../umbreon" .ROOT_DIR)}}'
    cmds:
      - bash build_umbreon_posix/run.sh "{{.WORKDIR}}" "{{.UMBREON_SRC}}"

  install_meshms:
    desc: "Build+install MeshMS into the deplibs prefix (override source dir with MESHMS_SRC=...)"
    vars:
      # MeshMS is checked out parallel to the cuemol2 repo (same convention as
      # umbreon above; the repo directory name is capitalized "MeshMS").
      MESHMS_SRC: '{{.MESHMS_SRC | default (printf "%s/../../MeshMS" .ROOT_DIR)}}'
    cmds:
      - bash build_meshms_posix/run.sh "{{.WORKDIR}}" "{{.MESHMS_SRC}}"

  #####

  bump_version_build:
    desc: "Bump the build number (x.y.z.BUILD) via bump-my-version"
    cmds:
      - bash bump_version_build.sh

  bump_version_rev:
    desc: "Bump the revision number (x.y.REV.build) via bump-my-version"
    cmds:
      - bash bump_version_rev.sh

  #####

  rebuild_libcuemol2:
    desc: "Config & Rebuild libcuemol2"
    deps:
      - task: rebuild_libcuemol2:{{OS}}

  rebuild_libcuemol2:darwin:
    platforms: [darwin]
    env:
      EMBED_PYTHON_ROOT: '{{.EMBED_PYTHON_ROOT | default (env "EMBED_PYTHON_ROOT")}}'
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - bash build_libcuemol2_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  rebuild_libcuemol2:linux:
    platforms: [linux]
    env:
      EMBED_PYTHON_ROOT: '{{.EMBED_PYTHON_ROOT | default (env "EMBED_PYTHON_ROOT")}}'
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - bash build_libcuemol2_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  rebuild_libcuemol2:windows:
    platforms: [windows]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - bash build_libcuemol2_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  build_libcuemol2:
    desc: "Build libcuemol2 (using current config)"
    deps:
      - task: build_libcuemol2:{{OS}}

  build_libcuemol2:darwin:
    desc: "Rebuild libcuemol2 (without running setup/config)"
    platforms: [darwin]
    cmds:
      - cmake --build "{{.LIBCUEMOL2_BUILDDIR}}" --parallel "{{.PARALLEL}}" --config "{{.CONFIG}}" --target install

  build_libcuemol2:linux:
    desc: "Rebuild libcuemol2 (without running setup/config)"
    platforms: [linux]
    cmds:
      - cmake --build "{{.LIBCUEMOL2_BUILDDIR}}" --parallel "{{.PARALLEL}}" --config "{{.CONFIG}}" --target install

  build_libcuemol2:windows:
    platforms: [windows]
    cmds:
      - cmake --build "{{.LIBCUEMOL2_BUILDDIR}}" --parallel "{{.PARALLEL}}" --config "{{.CONFIG}}" --target install

  run_gtest:
    desc: "Run C++ unit tests (ctest). TEST=<binary> filters by label (e.g. test_qlib), FILTER=<regex> filters by test name."
    vars:
      TEST: '{{default "" .TEST}}'
      FILTER: '{{default "" .FILTER}}'
    cmds:
      - ctest --test-dir "{{.LIBCUEMOL2_BUILDDIR}}" --output-on-failure{{if .TEST}} -L "{{.TEST}}"{{end}}{{if .FILTER}} -R "{{.FILTER}}"{{end}}

  clean_libcuemol2:
    desc: "Clean up the libcuemol2 obj dir"
    cmds:
      - rm -rf "{{.LIBCUEMOL2_BUILDDIR}}"
      - rm -rf "{{.LIBCUEMOL2_INSTDIR}}"

  clean_shaders:
    desc: "Clean up the libcuemol2 shader files"
    cmds:
      - find "{{.LIBCUEMOL2_BUILDDIR}}" -name "*.glsl" | xargs rm
      - find "{{.LIBCUEMOL2_INSTDIR}}" -name "*.glsl" | xargs rm

#####

  build_pytest:
    deps:
      - task: build_pytest:{{OS}}

  build_pytest:darwin:
    platforms: [darwin]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - task: build_libcuemol2
      - bash build_pymod_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

#####

  build_tritium_core:
    desc: "Build tritium/core native addon (test via test_tritium_core)"
    deps:
      - task: build_tritium_core:{{OS}}

  build_tritium_core:darwin:
    platforms: [darwin]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - task: build_libcuemol2
      - bash build_tritium_core_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  build_tritium_core:linux:
    platforms: [linux]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - task: build_libcuemol2
      - bash build_tritium_core_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  build_tritium_core:windows:
    platforms: [windows]
    cmds:
      - task: build_libcuemol2
      - cmd /c build_tritium_core_posix\\run_win.bat "{{.WORKDIR}}"

#####

  build_cli:
    deps:
      - task: build_cli:{{OS}}

  build_cli:darwin:
    platforms: [darwin]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - task: build_libcuemol2
      - bash build_cuetty_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  run_cli:
    platforms: [darwin]
    cmds:
      # - task: build_cli
      - env LD_LIBRARY_PATH="{{.LIBCUEMOL2_INSTDIR}}/lib" "{{.LIBCUEMOL2_INSTDIR}}/bin/cuetty" -i

#####

  build_tritium:
    desc: "Build tritium (Electron+React GUI app)"
    deps:
      - task: build_tritium:{{OS}}

  build_tritium:darwin:
    platforms: [darwin]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - task: build_libcuemol2
      - bash build_tritium_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  build_tritium:linux:
    platforms: [linux]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - task: build_libcuemol2
      - bash build_tritium_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  build_tritium:windows:
    platforms: [windows]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - task: build_libcuemol2
      - bash build_tritium_posix/run.sh "{{.WORKDIR}}" "{{.CONFIG}}"

  clean_tritium:
    desc: "Clean tritium build artifacts (core native addon + react-gui out)"
    cmds:
      - rm -rf "{{.ROOT_DIR}}/../tritium/core/build"
      - rm -rf "{{.ROOT_DIR}}/../tritium/react-gui/out"

  rebuild_tritium:
    desc: "Clean tritium/core build artifacts and rebuild tritium from scratch"
    cmds:
      - task: clean_tritium
      - task: build_tritium

  run_tritium:
    desc: "Run the built tritium Electron app"
    dir: "{{.ROOT_DIR}}/../tritium/react-gui"
    env:
      # Dev default render-binary roots, read by main/ipcHandlers.ts
      # getRenderBinaries(): LIBCUEMOL2_ROOT -> <root>/bin/blendpng;
      # BUNDLE_APPS -> <bundle>/povray/bin/povray (downloaded by download_extpkgs).
      # LIBCUEMOL2_INSTDIR is ROOT_DIR-based (absolute), so a plain template is
      # fine; WORKDIR contains $HOME, which go-task does NOT expand in a plain
      # env value -- run it through `sh: echo` so the shell expands it.
      LIBCUEMOL2_ROOT: "{{.LIBCUEMOL2_INSTDIR}}"
      BUNDLE_APPS:
        sh: echo "{{.WORKDIR}}"
      # Clean-profile launch (dev): `task run_tritium FRESH=1` makes main wipe a
      # throwaway userData dir, so no previously persisted preference (electron-
      # store) or localStorage is read. Empty (default) -> normal profile.
      CUEMOL_FRESH_PREFS: "{{.FRESH}}"
    cmds:
      - pnpm run start

  package_tritium:
    desc: "Package the tritium app into a distributable (macOS arm64 DMG)"
    deps:
      - task: package_tritium:{{OS}}

  package_tritium:darwin:
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}/../tritium/react-gui"
    env:
      # Default install prefix used by the build tasks; collect-cuemol2-runtime.sh
      # also defaults to this, but set it explicitly so the env contract is clear.
      LIBCUEMOL2_ROOT: "{{.LIBCUEMOL2_INSTDIR}}"
      # Root of the downloaded external packages (povray/apbs/ffmpeg), staged into
      # the DMG by collect-cuemol2-runtime.sh. Same root as run_tritium; populate
      # it first with `task download_extpkgs`. WORKDIR contains $HOME, which
      # go-task does NOT expand in a plain env value -- run it through `sh: echo`.
      BUNDLE_APPS:
        sh: echo "{{.WORKDIR}}"
    cmds:
      - pnpm run package:mac

  make_tritium_icons:
    desc: "Regenerate the react-gui app icons (build/ icns+ico+png and the menu-bar asset) from a master PNG: MASTER=<path to 1024x1024 PNG>"
    dir: "{{.ROOT_DIR}}/../tritium/react-gui"
    requires:
      vars: [MASTER]
    cmds:
      # The master artwork is deliberately untracked (see scripts/make-icons.py),
      # so its path has to come in from the caller rather than a default.
      - python3 scripts/make-icons.py "{{.MASTER}}"

  lint_tritium:
    desc: "Lint react-gui TypeScript with ESLint (layering + floating-promise rules; warn-only baseline)"
    dir: "{{.ROOT_DIR}}/../tritium/react-gui"
    cmds:
      - pnpm run lint

  typecheck_tritium:
    desc: "Type-check react-gui (renderer+shared, then main+preload+shared)"
    dir: "{{.ROOT_DIR}}/../tritium/react-gui"
    cmds:
      - pnpm run typecheck

  lint_tritium_style:
    desc: "Lint react-gui CSS for raw hex/px outside the design tokens (warn-only; not wired into build_tritium)"
    dir: "{{.ROOT_DIR}}/../tritium/react-gui"
    cmds:
      - pnpm run lint:style

  lint_tritium_comments:
    desc: "Lint react-gui TS comments for disallowed non-ASCII glyphs (box-drawing/arrows/etc); fails on reintroduction"
    dir: "{{.ROOT_DIR}}/../tritium/react-gui"
    cmds:
      - pnpm run lint:comments

  test_tritium:
    desc: "Run tritium tests (core Jest + react-gui Vitest)"
    cmds:
      - task: test_tritium_core
      - task: test_tritium_react_gui

  test_tritium_core:
    desc: "Run tritium/core Jest tests (Node pinned via tritium/.nvmrc)"
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      # Delegate to the same script CI uses (test_tritium_core_posix/run.sh); the
      # Taskfile only layers the local Node pin (nvm) so there is one core-test source.
      - bash -c 'set -e; export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"; . "$NVM_DIR/nvm.sh"; cd "{{.ROOT_DIR}}/../tritium"; nvm use >/dev/null; bash "{{.ROOT_DIR}}/test_tritium_core_posix/run.sh" "{{.WORKDIR}}"'

  test_tritium_react_gui:
    desc: "Run tritium/react-gui Vitest tests (Node pinned via tritium/.nvmrc)"
    dir: "{{.ROOT_DIR}}/../tritium/react-gui"
    cmds:
      - bash -c 'set -e; export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"; . "$NVM_DIR/nvm.sh"; nvm use; pnpm test'

#####

  rebuild_uxpgui:
    desc: "Setup, config, and build the uxpgui app"
    platforms: [darwin]
    env:
      OUT_DIR: '{{.OUTDIR}}'
    cmds:
      - bash build_uxpgui_posix/run.sh "{{.WORKDIR}}" macOS ARM64

  build_uxpgui:
    desc: "Build the uxpgui app (without running setup/config)"
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}/../uxp_gui/"
    cmds:
      - ./mach build

  run_uxpgui:
    desc: "Run the built uxpgui app"
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}/../uxp_gui/"
    cmds:
      - ./obj-aarch64-apple-darwin/dist/CueMol2.app/Contents/MacOS/cuemol2

  clean_uxpgui:
    desc: "Clean up uxpgui obj dir"
    cmds:
      - rm -rf "{{.ROOT_DIR}}/../uxp_gui/obj-*"

#####

  uxpgui:
    desc: "Build libcuemol2 and uxp and run the built app"
    platforms: [darwin]
    cmds:
      - task: build_libcuemol2
      - task: build_uxpgui
      - task: run_uxpgui
