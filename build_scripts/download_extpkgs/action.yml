name: 'Download external packages posix'
description: 'Download external packages posix'

inputs:
  basedir:
     description: 'base dir'
     required: true

runs:
  using: "composite"
  steps:

  - name: Download extpkgs
    shell: bash
    run: |
      set -eux
      if [[ "$RUNNER_OS" == "Windows" ]]; then
        cd "$(cygpath -u "${GITHUB_WORKSPACE}")"
        bash build_scripts/download_extpkgs/run_win.sh "${{ inputs.basedir }}" ${RUNNER_ARCH}
      else
        cd ${GITHUB_WORKSPACE}
        BASEDIR=${{ inputs.basedir }}
        bash build_scripts/download_extpkgs/run.sh $BASEDIR ${{ runner.os }} ${{ runner.arch }}
      fi

