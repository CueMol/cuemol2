name: Build (Linux)

on:
  push:
#    branches-ignore:
#      - '**'
  workflow_dispatch:

# Cancel a superseded in-progress run on the same ref and event (see build2.yml
# for the rationale behind including event_name in the key).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

###############################################

jobs:
  build_posix:
    name: '${{ matrix.name }}'
    runs-on: ${{ matrix.os }}
    # Package tritium only on the release cadence (develop / tags / manual
    # dispatch), not on every feature-branch push. Core build + tests run always.
    env:
      DO_PACKAGE: ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: "Ubuntu 22 x64"

    steps:
    - uses: actions/checkout@v4
      with:
        # Do NOT fetch Git LFS objects: the repo is over its LFS budget, so an
        # LFS fetch fails the checkout. The only LFS files are two pytest
        # fixtures whose tests self-skip when the data is absent (conftest.py).
        lfs: false

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Enable pnpm via corepack
      shell: bash
      run: corepack enable

    - name: Show build env versions
      shell: bash
      run: |
        set -eux
        echo "RUNNER_TYPE=${{ matrix.os }}" >> $GITHUB_ENV
        uname -a
        gcc --version
        python3 --version
        python3 -m pip --version
        ninja --version

    - name: Download deplibs
      uses: ./build_scripts/download_deplibs
      with:
        basedir: ${{ github.workspace }}/target

    - name: Build libcuemol2
      uses: ./build_scripts/build_libcuemol2_posix
      with:
        basedir: ${{ github.workspace }}/target
        
    - name: Run gtest
      shell: bash
      run: |
        set -eux
        ctest --test-dir ${{ github.workspace }}/target/build_libcuemol2 --output-on-failure

    - name: Build python module
      uses: ./build_scripts/build_pymod_posix
      with:
        basedir: ${{ github.workspace }}/target

    - name: Build tritium/core addon
      uses: ./build_scripts/build_tritium_core_posix
      with:
        basedir: ${{ github.workspace }}/target

    - name: Test tritium/core addon
      uses: ./build_scripts/test_tritium_core_posix
      with:
        basedir: ${{ github.workspace }}/target

    - name: Build cuetty
      uses: ./build_scripts/build_cuetty_posix
      with:
        basedir: ${{ github.workspace }}/target

    - name: Check cuetty run
      shell: bash
      run: |
        set -eux
        BASEDIR=${{ github.workspace }}/target
        ls -la $BASEDIR/cuemol2/bin/cuetty
        ldd $BASEDIR/cuemol2/bin/cuetty
        env LD_LIBRARY_PATH=$BASEDIR/cuemol2/lib $BASEDIR/cuemol2/bin/cuetty

    - name: Get version
      id: version
      if: env.DO_PACKAGE == 'true'
      shell: bash
      run: |
        VERSION=$(grep '#define QM_VERSION' src/_version.h | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    # Package the tritium Electron app (Linux x64 AppImage + deb, unsigned).
    # Release cadence only (develop / workflow_dispatch / tags); see DO_PACKAGE.
    - name: Install AppImage build deps
      if: env.DO_PACKAGE == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libfuse2

    - name: Package tritium (Linux x64 AppImage + deb)
      if: env.DO_PACKAGE == 'true'
      shell: bash
      run: |
        set -eux
        export LIBCUEMOL2_ROOT=${{ github.workspace }}/target/cuemol2
        bash tritium/packaging/package.sh --linux --x64

    - name: Upload tritium Linux artifacts
      if: env.DO_PACKAGE == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: CueMol3_${{ steps.version.outputs.version }}_linux_x64
        path: |
          tritium/react-gui/release/*.AppImage
          tritium/react-gui/release/*.deb
        if-no-files-found: error

    # On a tag, attach the Linux artifacts to the GitHub release (appends to the
    # release that build2.yml's release_build creates for the same tag).
    - name: Attach Linux artifacts to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          tritium/react-gui/release/*.AppImage
          tritium/react-gui/release/*.deb
