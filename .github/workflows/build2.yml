name: Build and release

on:
  push:
    branches:
      - '**'  # All branches
    tags:
      - 'v*'  # Release tags (v1.0.0, etc)
#  pull_request:
  workflow_dispatch:

#    branches-ignore:
#      - '**'

# Cancel a superseded in-progress run when a newer one starts for the same ref
# and event, so a push train (repeated pushes to a branch) does not pile up
# parallel runs. event_name is part of the key so a manual workflow_dispatch
# (release) run is not cancelled by a later push to the same branch, and tag
# runs (distinct ref) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  mozbuild-cache-version: v1

  BUILD_MODE: >-
    ${{
      (github.ref == 'refs/heads/develop' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')) && 'full' || 'quick'
    }}

###############################################

jobs:
  # Compute the build_posix matrix. The non-embed legs (arm64 + Intel) run on
  # every push; the py312 (embed-python) leg is added only on the release
  # cadence (develop / tag / manual dispatch), so feature-branch pushes do not
  # rebuild the embed-python variant every time. A dynamic matrix is used
  # because a job-level if cannot reference the matrix context.
  setup_matrix:
    runs-on: ubuntu-latest
    outputs:
      posix-matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Compute build_posix matrix
        id: gen
        shell: bash
        run: |
          base='{"os":"macos-15","name":"MacOS 15 arm64 clang","embed-python":"","postfix":""},{"os":"macos-15-intel","name":"MacOS 15 x64 clang","embed-python":"","postfix":""}'
          py312='{"os":"macos-15","name":"MacOS 15 arm64 clang py312","embed-python":"3.12","postfix":"_py312"}'
          if [ "${{ env.BUILD_MODE }}" = "full" ]; then
            echo "matrix={\"include\":[$base,$py312]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$base]}" >> "$GITHUB_OUTPUT"
          fi

  build_posix:
    name: '${{ matrix.name }}'
    needs: setup_matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup_matrix.outputs.posix-matrix) }}

    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      # Ship the umbreon (Embree) ray-tracing backend. Injected here rather than
      # flipped in build_libcuemol2_posix/run.sh because src/cmake/umbreon.cmake
      # does find_package(umbreon CONFIG REQUIRED): a default of ON would break
      # configure for any local checkout that has not run `task install_umbreon`.
      ENABLE_UMBREON: "ON"

    steps:
    - name: Show build mode
      run: |
        echo "BUILD_MODE: ${{ env.BUILD_MODE }}"
        echo "Branch/Tag: ${{ github.ref }}"
        echo "Event: ${{ github.event_name }}"
        echo "Build type: ${{ matrix.os }}"
        echo "Embed python: ${{ matrix.embed-python }}"

    - uses: actions/checkout@v4
      with:
        # Do NOT fetch Git LFS objects: the repo is over its LFS budget, so an
        # LFS fetch fails the checkout. The only LFS files are two pytest
        # fixtures whose tests self-skip when the data is absent (conftest.py).
        lfs: false

    - name: Get version
      id: version
      shell: bash
      run: |
        VERSION=$(grep '#define QM_VERSION' src/_version.h | sed 's/.*"\(.*\)".*/\1/')
        TARGET="cuemol2_${VERSION}_${{ runner.os }}_${{ runner.arch }}${{ matrix.postfix }}"
        echo $VERSION
        echo "Build: $TARGET"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "artifact-base=$TARGET" >> "$GITHUB_OUTPUT"

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9
      with:
        version: "v0.12.0"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Enable pnpm via corepack
      shell: bash
      run: corepack enable

    - name: Show build env versions
      shell: bash
      run: |
        echo "RUNNER_TYPE=${{ matrix.os }}" >> $GITHUB_ENV
        echo "EMBED_PYTHON=${{ matrix.embed-python }}" >> $GITHUB_ENV
        set -eux
        clang --version
        xcodebuild -version
        ninja --version

    - name: Download deplibs
      uses: ./build_scripts/download_deplibs
      with:
        basedir: ${{ github.workspace }}/target

    # umbreon is built from source (CueMol/umbreon at UMBREON_GIT_REF); Embree /
    # TBB / OIDN come prebuilt in the deplibs bundle. libcuemol2 then links it
    # via find_package(umbreon), resolving those deps to the same bundled copies.
    - name: Read umbreon git ref
      shell: bash
      run: |
        . build_scripts/deplibs.env
        echo "UMBREON_GIT_REF=$UMBREON_GIT_REF" >> $GITHUB_ENV

    - name: Build+install umbreon
      uses: ./build_scripts/build_umbreon_posix
      with:
        basedir: ${{ github.workspace }}/target
        ref: ${{ env.UMBREON_GIT_REF }}

    - name: Build libcuemol2
      uses: ./build_scripts/build_libcuemol2_posix
      with:
        basedir: ${{ github.workspace }}/target

    # Run the C++ gtest suite on macOS (Linux runs it in build_linux.yml, Windows
    # in the build_win job below). The posix build already produces the test
    # executables (BUILD_TESTS=ON in build_libcuemol2_posix/run.sh), so this is
    # just the ctest invocation. Deliberately not gated on BUILD_MODE: catching a
    # regression is the point, so it runs on feature-branch pushes too.
    - name: Run gtest
      shell: bash
      run: |
        set -eux
        ctest --test-dir ${{ github.workspace }}/target/build_libcuemol2 --output-on-failure

    - name: Build and check cuetty
      uses: ./build_scripts/build_cuetty_posix
      with:
        basedir: ${{ github.workspace }}/target

    - name: Check cuetty run
      shell: bash
      run: |
        set -eux
        BASEDIR=${{ github.workspace }}/target
        ls -la $BASEDIR/cuemol2/bin/cuetty
        env LD_LIBRARY_PATH=$BASEDIR/cuemol2/lib $BASEDIR/cuemol2/bin/cuetty
        
    - name: Build and test python module
      uses: ./build_scripts/build_pymod_posix
      with:
        basedir: ${{ github.workspace }}/target

    - name: Build tritium/core addon
      uses: ./build_scripts/build_tritium_core_posix
      with:
        basedir: ${{ github.workspace }}/target

    - name: Test tritium/core addon
      uses: ./build_scripts/test_tritium_core_posix
      with:
        basedir: ${{ github.workspace }}/target

    # Fetch the external bundle apps (POV-Ray / apbs-pdb2pqr / ffmpeg) before
    # packaging so collect-cuemol2-runtime.sh can stage them into the DMG (via
    # BUNDLE_APPS below). The same download also feeds the UXP GUI build later.
    - name: Download external packages
      if: env.BUILD_MODE == 'full'
      uses: ./build_scripts/download_extpkgs
      with:
        basedir: ${{ github.workspace }}/target

    # Package the tritium Electron app (macOS arm64 DMG, ad-hoc signed).
    # Runs only on the arm64 non-embed-Python leg, in full mode (develop /
    # workflow_dispatch / tags) -- not on every feature-branch push.
    - name: Package tritium (macOS arm64 DMG)
      if: matrix.os == 'macos-15' && matrix.embed-python == '' && env.BUILD_MODE == 'full'
      shell: bash
      run: |
        set -eux
        export LIBCUEMOL2_ROOT=${{ github.workspace }}/target/cuemol2
        export BUNDLE_APPS=${{ github.workspace }}/target
        cd tritium/react-gui
        pnpm run package:mac

    - name: Upload tritium DMG
      if: matrix.os == 'macos-15' && matrix.embed-python == '' && env.BUILD_MODE == 'full'
      uses: actions/upload-artifact@v4
      with:
        name: CueMol3_${{ steps.version.outputs.version }}_mac_arm64
        path: tritium/react-gui/release/*.dmg
        if-no-files-found: error

    - name: Build UXP GUI
      if: env.BUILD_MODE == 'full'
      id: build-artifact
      uses: ./build_scripts/build_uxpgui_posix
      with:
        basedir: ${{ github.workspace }}/target
        artifact-name: ${{ steps.version.outputs.artifact-base }}

    - name: Upload artifact
      if: env.BUILD_MODE == 'full'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.version.outputs.artifact-base }}
        path: ${{ steps.build-artifact.outputs.artifact-path }}

###############################################

  build_win_x64:
    name: "Windows intel msvc"
    runs-on: windows-2022
    env:
      # See the build_posix job: umbreon is opted into per-workflow, not by
      # flipping the build script default.
      ENABLE_UMBREON: "ON"
    steps:
    - uses: actions/checkout@v4
      with:
        # Do NOT fetch Git LFS objects: the repo is over its LFS budget, so an
        # LFS fetch fails the checkout. The only LFS files are two pytest
        # fixtures whose tests self-skip when the data is absent (conftest.py).
        lfs: false

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup build envvars
      shell: bash
      run: |
        MSYS_TOP_DIR=$(cygpath -u '${{ github.workspace }}')
        echo "MSYS_TOP_DIR=$MSYS_TOP_DIR" >> $GITHUB_ENV

        MSYS_TOP_DIR2=$(cygpath -m '${{ github.workspace }}')
        echo "MSYS_TOP_DIR2=$MSYS_TOP_DIR2" >> $GITHUB_ENV

        echo NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS

    - name: Get version
      id: version
      shell: bash
      run: |
        VERSION=$(grep '#define QM_VERSION' src/_version.h | sed 's/.*"\(.*\)".*/\1/')
        TARGET="cuemol2_${VERSION}_${{ runner.os }}_${{ runner.arch }}"
        echo $VERSION
        echo "Build: $TARGET"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "artifact-base=$TARGET" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: C:\mozilla-build\
        key: mozbuild-${{ env.mozbuild-cache-version }}
        restore-keys: |
          mozbuild-

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Enable pnpm via corepack
      shell: pwsh
      run: corepack enable

    - name: Enable GitHub Actions Cache backend
      shell: pwsh
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
        echo "SCCACHE_GHA_VERSION=${{ runner.os }}_${{ runner.arch }}" >> $env:GITHUB_ENV

    - name: Find and set sccache path
      shell: cmd
      run: |
        for /f "tokens=*" %%i in ('where sccache') do set SCCACHE_PATH=%%i & goto :done
        :done
        echo SCCACHE_PATH=%SCCACHE_PATH%
        echo SCCACHE_PATH=%SCCACHE_PATH%>> %GITHUB_ENV%

    - name: Download deplibs
      uses: ./build_scripts/download_deplibs
      with:
        basedir: ${{ github.workspace }}\target

    # See the build_posix job. build_umbreon_posix/run.sh cygpath-normalizes its
    # arguments, so the same action serves the MSVC leg.
    - name: Read umbreon git ref
      shell: bash
      run: |
        . build_scripts/deplibs.env
        echo "UMBREON_GIT_REF=$UMBREON_GIT_REF" >> $GITHUB_ENV

    - name: Build+install umbreon
      uses: ./build_scripts/build_umbreon_posix
      with:
        basedir: ${{ github.workspace }}\target
        ref: ${{ env.UMBREON_GIT_REF }}

    - name: Build libcuemol2
      uses: ./build_scripts/build_libcuemol2_posix
      with:
        basedir: ${{ github.workspace }}\target

    # Run the C++ gtest suite on Windows too (Linux runs it in build_linux.yml,
    # macOS in the build_posix job above).
    # Windows builds with BUILD_TESTS=ON (build_libcuemol2_win.bat) and PRE_TEST
    # discovery (src/tests/CMakeLists.txt), so tests are enumerated and executed
    # here rather than at build time. The build dir is <basedir>/tmp/build_libcuemol2
    # because win.bat runs cmake from %BASEDIR%\tmp. The test exes sit in Release/
    # next to cuemol2.dll, but their transitive deps (Boost etc.) live in the
    # deplibs prefixes under target/. Windows has no rpath, so put every directory
    # that contains a DLL under target/ on PATH; otherwise the loader fails with
    # 0xc0000135 (DLL not found).
    - name: Run gtest (Windows)
      shell: bash
      run: |
        set -eux
        WS="$(cygpath -u '${{ github.workspace }}')"
        BUILD_DIR="$WS/target/tmp/build_libcuemol2"
        DLL_DIRS=$(find "$WS/target" -name '*.dll' -exec dirname {} \; | sort -u | tr '\n' ':')
        echo "--- DLL directories added to PATH ---"; echo "$DLL_DIRS" | tr ':' '\n'
        export PATH="${DLL_DIRS}${PATH}"
        ctest --test-dir "$BUILD_DIR" --output-on-failure

    - name: Build tritium/core addon
      uses: ./build_scripts/build_tritium_core_posix
      with:
        basedir: ${{ github.workspace }}\target

    - name: Test tritium/core addon
      uses: ./build_scripts/test_tritium_core_posix
      with:
        basedir: ${{ github.workspace }}\target

    # Fetch the external bundle apps (POV-Ray / apbs-pdb2pqr / ffmpeg) before
    # packaging so collect-cuemol2-runtime.sh can stage them into the installer
    # (via BUNDLE_APPS below). The same download also feeds the UXP GUI build later.
    - name: Download external packages
      if: env.BUILD_MODE == 'full'
      uses: ./build_scripts/download_extpkgs
      with:
        basedir: ${{ github.workspace }}/target

    # Package the tritium Electron app (Windows x64 NSIS installer, unsigned).
    # Full mode only (develop / workflow_dispatch / tags).
    - name: Package tritium (Windows x64 NSIS)
      if: env.BUILD_MODE == 'full'
      shell: bash
      run: |
        set -eux
        cd "$(cygpath -u '${{ github.workspace }}')"
        export LIBCUEMOL2_ROOT="$PWD/target/cuemol2"
        export BUNDLE_APPS="$PWD/target"
        bash tritium/packaging/package.sh --win --x64

    - name: Upload tritium Windows installer
      if: env.BUILD_MODE == 'full'
      uses: actions/upload-artifact@v4
      with:
        name: CueMol3_${{ steps.version.outputs.version }}_win_x64
        path: tritium/react-gui/release/*.exe
        if-no-files-found: error

    - name: Build and check cuetty
      uses: ./build_scripts/build_cuetty_posix
      with:
        basedir: ${{ github.workspace }}\target

    - name: Make mozconfig
      if: env.BUILD_MODE == 'full'
      shell: bash
      run: bash ${MSYS_TOP_DIR}/build_scripts/build_uxpgui_win/make_mozconfig.sh

    - name: Run mozilla build and build UXP
      if: env.BUILD_MODE == 'full'
      shell: cmd
      run: |
        cmd /c C:\mozilla-build\start-shell.bat %MSYS_TOP_DIR%/build_scripts/build_uxpgui_win/run.sh ${MSYS_TOP_DIR}/target

    - name: Check and copy artifacts
      if: env.BUILD_MODE == 'full'
      id: build-artifact
      shell: bash
      env:
        ARTIFACT_NAME: ${{ steps.version.outputs.artifact-base }}.tar.bz2
      run: |
        set -eux
        cd $MSYS_TOP_DIR/uxp_gui
        # obj-x86_64-pc-mingw32/dist/cuemol2-2.3.0.461.win64.installer.exe
        cp obj-x86_64-pc-mingw32/dist/cuemol2-*.installer.exe $MSYS_TOP_DIR/
        cd $MSYS_TOP_DIR
        ls -l cuemol2-*.installer.exe
        tar cjvf $MSYS_TOP_DIR/${ARTIFACT_NAME} cuemol2-*.installer.exe
        echo "artifact-path=${GITHUB_WORKSPACE}/${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

    - name: Upload artifact
      if: env.BUILD_MODE == 'full'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.version.outputs.artifact-base }}
        path: ${{ steps.build-artifact.outputs.artifact-path }}

###############################################

  release_build:
    needs: [build_posix, build_win_x64]
    runs-on: ubuntu-latest
    steps:
    - name: Download All Artifacts
      if: env.BUILD_MODE == 'full'
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    # - run: |
    #     ls -lR

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: artifacts/*
