name: oneTBB smoke (ENABLE_TBB=ON)

# Isolated, manually-triggered build of libcuemol2 with ENABLE_TBB=ON across all
# three release platforms. Kept separate from build2.yml / build_linux.yml so a
# failing oneTBB build can never block the shared pipeline. The regular
# pipelines build with ENABLE_TBB=OFF and are unaffected.
#
# - Linux / macOS: build libcuemol2 and run the C++ gtest suite (validates the
#   parallel abstraction's behaviour; tests run here).
# - Windows: build + link only (BUILD_TESTS=OFF on Windows); this proves the
#   MSVC static-oneTBB build links, which is the main de-risking target.

on:
  # During the staged rollout this also runs on pushes to oneTBB branches, so
  # the smoke build can be validated before the file reaches the default branch
  # (workflow_dispatch only becomes available once it is on the default branch).
  # Drop the push trigger once ENABLE_TBB is the default everywhere.
  push:
    branches:
      - '*tbb*'
  workflow_dispatch:

concurrency:
  group: tbb-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: '${{ matrix.name }}'
    runs-on: ${{ matrix.os }}
    env:
      # Inject ENABLE_TBB into the existing build scripts (run.sh / win.bat).
      # Quoted so YAML does not coerce it to the boolean true.
      ENABLE_TBB: "ON"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: "Ubuntu 22 x64 (TBB)"
          - os: macos-15
            name: "macOS 15 arm64 (TBB)"
          - os: windows-2022
            name: "Windows 2022 x64 (TBB)"

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Windows libcuemol2 builds with MSVC (cl) via build_libcuemol2_win.bat;
    # this puts cl on PATH, mirroring build2.yml's Windows job.
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
      with:
        arch: x64

    # Match build2.yml's Windows job: build_libcuemol2_posix sets the sccache GHA
    # backend env only on posix, so on Windows the workflow must set it.
    # Otherwise sccache runs in local-disk mode and the final `sccache -s` in
    # build_libcuemol2_win.bat exits non-zero, failing the step after a
    # successful build.
    - name: Enable sccache GHA backend (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
        echo "SCCACHE_GHA_VERSION=${{ runner.os }}_${{ runner.arch }}" >> $env:GITHUB_ENV

    - name: Find and set sccache path (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        for /f "tokens=*" %%i in ('where sccache') do set SCCACHE_PATH=%%i & goto :done
        :done
        echo SCCACHE_PATH=%SCCACHE_PATH%
        echo SCCACHE_PATH=%SCCACHE_PATH%>> %GITHUB_ENV%

    - name: Record runner type
      shell: bash
      run: echo "RUNNER_TYPE=${{ matrix.os }}" >> $GITHUB_ENV

    - name: Download deplibs
      uses: ./build_scripts/download_deplibs
      with:
        basedir: ${{ github.workspace }}/target

    - name: Build libcuemol2 (ENABLE_TBB=ON)
      uses: ./build_scripts/build_libcuemol2_posix
      with:
        basedir: ${{ github.workspace }}/target

    # Behaviour of the parallel abstraction is validated here (Windows builds
    # with BUILD_TESTS=OFF, so its job is purely build + link).
    - name: Run gtest
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -eux
        ctest --test-dir ${{ github.workspace }}/target/build_libcuemol2 --output-on-failure
