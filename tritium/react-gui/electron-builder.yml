# ==============================================================================
# electron-builder configuration for CueMol3 (macOS arm64 / ad-hoc signed)
# ==============================================================================
#
# Background
# ----------
# This app is a pnpm monorepo. react-gui/ depends on the @cuemol/core workspace
# package, which wraps a C++ native addon (cuemol_internal.node) that links
# against libcuemol2.dylib and Boost dylibs installed at a machine-specific
# path (LIBCUEMOL2_ROOT). Three packaging challenges arise:
#
#   1. Native addon outside node_modules
#      @cuemol/core lives at ../../core/ (monorepo); pnpm symlinks it into
#      react-gui/node_modules/@cuemol/core -> ../../../core.  If it were a
#      production dependency, electron-builder would follow that symlink via
#      fs.realpath and reject files whose real path is outside react-gui/.
#      SOLUTION: @cuemol/core is declared as a *devDependency*, so electron-builder
#      does not walk it.  Its minimal runtime files are staged into
#      packaging/staging/ (by collect-cuemol2-runtime.sh) and mapped to
#      node_modules/ via the files FileSet below.
#
#   2. Relocatable LC_RPATH in cuemol_internal.node
#      At C++ build time cmake sets INSTALL_RPATH "@loader_path/../lib" with
#      BUILD_WITH_INSTALL_RPATH (tritium/core/CMakeLists.txt), so the .node
#      already carries a relocatable rpath that resolves to the dylibs staged
#      beside it -- no post-pack rpath rewrite is needed.  The afterPack hook
#      (build/afterPack.js) applies the deep ad-hoc signature.
#
#   3. sysconfig.xml path baked into cuemol_internal.node
#      DEFAULT_CONFIG is compiled in as an absolute path.  In the packaged app
#      the cuemol2 data tree is copied to Contents/Resources/cuemol2/share/.
#      SOLUTION: main/ipcHandlers.ts (getSysConfigPath, APP_PATH handler)
#      detects app.isPackaged and computes the correct runtime path from
#      process.resourcesPath, then forwards it to the Web Worker via the
#      'apppath' IPC channel.
#
# asar: false
# -----------
# asar is intentionally disabled.  electron-builder's asarUnpack patterns do
# not apply to files contributed via FileSet from/to remapping, so the native
# .node would end up locked inside the asar archive where dyld cannot load it.
# With asar=false all files are laid out directly under Contents/Resources/app/,
# which also makes it easy to inspect the bundle contents for debugging.

appId: org.cuemol.cuemol3
productName: CueMol3
asar: false
nodeGypRebuild: false
npmRebuild: false

# Deep ad-hoc codesign the macOS .app before the DMG is built (mac.identity does
# not do ad-hoc in electron-builder 25.x -- see the mac: block and the hook).
afterPack: build/afterPack.js

# Fallback artifact name. The package name is scoped (@cuemol/react-gui);
# without an explicit template the deb target derives a filename containing '/'
# and fpm fails, so this has to stay set even though every shipped target
# overrides it below.
#
# The shipped names are per-target (dmg / nsis / appImage / deb) because this
# generic template cannot say what a user needs to know from the filename:
#   - ${arch} expands to each target's own spelling (arm64 / x64 / x86_64 /
#     amd64), so one release carried four different words for two machines;
#   - ${version} is the 3-part semver electron-builder requires, which drops
#     the build number that distinguishes two builds of the same revision;
#   - nothing marks which OS a file is for, or whether it installs something
#     or IS the app.
# See the artifactName under each target, and ADR-0056.
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: release

# files: what goes into Contents/Resources/app/ inside the .app bundle
#
# The app itself (out/) plus package.json go in directly.
# The monorepo @cuemol/core cannot be referenced as "../core" because
# electron-builder would follow the symlink and error on files outside react-gui/.
# Instead, packaging/package-mac.sh pre-stages the minimal set of runtime files
# into packaging/staging/, and we map that to node_modules/ here.
#
# Staged layout:
#   packaging/staging/
#     @cuemol/core/
#       package.json          <- needed by `bindings` to locate the .node file
#       src/index.cjs         <- CJS entry; loaded by require("@cuemol/core")
#       build/Release/
#         cuemol_internal.node
#     bindings/               <- runtime dep of @cuemol/core
#     file-uri-to-path/       <- runtime dep of bindings
files:
  - out/**/*
  - package.json
  - from: packaging/staging
    to: node_modules
    filter:
      - "**/*"

# extraResources: the cuemol2 data tree (share/ only)
#
# dylibs are no longer placed here.  Instead, cmake post-build copies them to
# core/build/lib/, and collect-cuemol2-runtime.sh stages them into
# packaging/staging/@cuemol/core/build/lib/.  electron-builder then places them
# at Contents/Resources/app/node_modules/@cuemol/core/build/lib/, which is
# exactly where the @loader_path/../lib rpath in cuemol_internal.node resolves.
#
# Only sysconfig.xml and the data tree need to be in cuemol2/share/;
# main/ipcHandlers.ts computes this path via process.resourcesPath when packaged.
#
# .app bundle layout (relevant parts):
#   Contents/
#     Resources/
#       app/
#         node_modules/@cuemol/core/build/
#           Release/cuemol_internal.node
#           lib/libcuemol2.dylib, libboost_*.dylib
#       cuemol2/
#         share/
#           sysconfig.xml
#           data/
#           ...
#         bin/
#           blendpng
#       bundle_apps/
#         povray/bin/povray, povray/include/
#         apbs/{apbs,pdb2pqr,dat/}   (staged for uxp parity; not yet wired)
#         ffmpeg/bin/ffmpeg          (staged for uxp parity; not yet wired)
extraResources:
  - from: packaging/cuemol2-runtime/share
    to: cuemol2/share
    filter:
      - "**/*"
  # blendpng (libcuemol2 utility) -> Resources/cuemol2/bin/blendpng
  - from: packaging/cuemol2-runtime/bin
    to: cuemol2/bin
    filter:
      - "**/*"
  # external bundle apps (POV-Ray / apbs-pdb2pqr / ffmpeg) -> Resources/bundle_apps/
  # collect-cuemol2-runtime.sh stages these from BUNDLE_APPS (task download_extpkgs).
  - from: packaging/cuemol2-runtime/bundle_apps
    to: bundle_apps
    filter:
      - "**/*"

mac:
  # arm64 DMG only (matches host build of libcuemol2.dylib)
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.education
  # OS and arch are literal, not ${arch}: the point of the override is to name
  # one spelling per machine, and each target above declares exactly one arch
  # (pinned by __test__/artifactNaming.test.ts, which is what makes a literal
  # safe here). CM_FULL_VERSION is the 4-part QM_VERSION exported by
  # packaging/package.sh -- ${version} would drop the build number.
  artifactName: ${productName}-${env.CM_FULL_VERSION}-macOS-arm64-Installer.${ext}
  # Ad-hoc signing is done by the afterPack hook (build/afterPack.js), not by
  # electron-builder. electron-builder 25.x treats `identity: "-"` as a keychain
  # identity name, finds none, and *skips* signing -- leaving the bundle with no
  # _CodeSignature seal (codesign --verify then fails). `identity: null` makes
  # that skip explicit; the hook then runs `codesign --force --deep --sign -`.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  # Document types, so a shell open (Finder "Open With", a Dock-tile drop, a
  # Dock recent document) reaches app.on('open-file'). Trimmed from the UXP
  # list in uxp_gui/cuemol2/app/macbuild/Contents/Info.plist.in.
  #
  # `rank: Alternate` is load-bearing: CueMol2 (UXP) declares no LSHandlerRank
  # and so gets the implicit "Default" rank, which outranks Alternate. That
  # keeps CueMol2 the double-click handler while CueMol3 still appears in
  # "Open With" and accepts a Dock drop. electron-builder maps ext / name /
  # role / rank straight onto CFBundleTypeExtensions / CFBundleTypeName /
  # CFBundleTypeRole / LSHandlerRank, so no hand-written extendInfo is needed.
  # `icon` is omitted, which falls back to the app icon -- there is no
  # document icon yet.
  #
  # Deliberately under `mac:` and NOT at the top level: a top-level
  # fileAssociations would also feed the NSIS installer, whose APP_ASSOCIATE
  # macro overwrites HKLM\Software\Classes\.qsc and would steal the Windows
  # default from CueMol2's Inno Setup registration. Windows instead gets an
  # "Open with"-only registration (Applications + OpenWithList, no ProgID, no
  # default claimed) via build/installer.nsh (nsis.include below), and Linux
  # gets a MimeType'd desktop entry + shared-mime-info XML via
  # linux.fileAssociations -- keep all three extension lists in sync.
  #
  # .pdb.gz is absent on purpose: macOS sees only the trailing `gz`, so
  # declaring it would claim every gzip file.
  fileAssociations:
    - ext: qsc
      name: CueMol Scene
      role: Editor          # CueMol writes .qsc (File > Save Scene)
      rank: Alternate
    - ext: [pdb, ent]
      name: PDB Coordinates
      role: Viewer
      rank: Alternate
    - ext: [cif, mmcif]
      name: mmCIF Coordinates
      role: Viewer
      rank: Alternate
    - ext: mol2
      name: Sybyl Mol2 Coordinates
      role: Viewer
      rank: Alternate
    - ext: [sdf, mol]
      name: MOL/SDF Coordinates
      role: Viewer
      rank: Alternate
    - ext: [ccp4, map, mrc]
      name: CCP4 Density Map
      role: Viewer
      rank: Alternate
    - ext: mtz
      name: MTZ Structure Factor
      role: Viewer
      rank: Alternate
    - ext: cns
      name: XPLOR/CNS Density Map
      role: Viewer
      rank: Alternate
    - ext: dx
      name: APBS Potential Map
      role: Viewer
      rank: Alternate
    - ext: [brix, omap]
      name: BRIX Density Map
      role: Viewer
      rank: Alternate

win:
  # x64 NSIS installer (assisted wizard; see the nsis: block below). The native
  # addon's dependent DLLs (cuemol2.dll + Boost) are staged next to
  # cuemol_internal.node in build/Release/ (no rpath on Windows; the loader
  # resolves DLLs from the module's own directory).
  # Unsigned for now (Authenticode signing is future work, ADR-0030 Phase 4:
  # drop in win.certificateFile or win.azureSignOptions + CSC_* CI secrets).
  target:
    - target: nsis
      arch: x64
  # 'Setup' rather than 'Installer': the Windows convention, and it keeps the
  # .exe from reading as the application itself.
  artifactName: ${productName}-${env.CM_FULL_VERSION}-Windows-x64-Setup.${ext}

# DMG presentation. Without this block every visual falls back to a default
# derived from the app icon, so the downloaded disk image and the app inside it
# looked the same in Finder. `icon` is the mounted volume's icon and the icon
# Finder shows for the .dmg file itself. The window layout (dmg.contents) is
# deliberately left at the default -- the legacy CueMol2 build dressed its DMG
# with a background image and a .DS_Store (uxp_gui/cuemol2/installer/Makefile.in),
# which is a separate piece of design work.
dmg:
  icon: build/installer-icon.icns
  # `title` is deliberately left at its default ("${productName} ${version}").
  # It does NOT expand ${env.*} -- setting it to the 4-part version mounted a
  # volume literally named 'CueMol3 ${env.CM_FULL_VERSION}' (verified on a real
  # build) -- and ${version} is only the 3-part semver, so there is no way to
  # match the filename here. The volume name is transient; the filename is what
  # the user keeps.

# NSIS options apply to the win nsis target above.
# Assisted (wizard) installer, not the silent one-click default:
# welcome -> choose install dir -> install -> finish. perMachine installs to
# Program Files for all users (UAC elevation), the conventional layout scientific
# desktop apps ship. installerIcon / uninstallerIcon are set explicitly to the
# badged installer artwork so the downloaded .exe does not look identical to the
# installed app in Explorer; the app's own icon stays build/icon.ico, picked up
# by name from buildResources. The addon resolves cuemol2.dll from its own directory and
# sysconfig.xml via process.resourcesPath (both install-dir relative), so a
# Program Files install works unchanged; runtime writes go to per-user
# electron userData (%APPDATA%), never into the install dir.
nsis:
  installerIcon: build/installer-icon.ico
  uninstallerIcon: build/installer-icon.ico
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # deleteAppDataOnUninstall: false  # default -- keep user settings on uninstall
  # customInstall/customUnInstall macros: register CueMol3 as an "Open with"
  # candidate for its file types WITHOUT claiming the default handler (the
  # Windows analogue of mac.fileAssociations rank: Alternate above).
  include: build/installer.nsh

linux:
  # x64 AppImage + deb. The native addon's shared libs are staged in
  # @cuemol/core/build/lib/ and resolved via the $ORIGIN/../lib rpath baked into
  # cuemol_internal.node (see tritium/core/CMakeLists.txt). Unsigned.
  # maintainer is required by the deb target (placeholder; adjust for release).
  maintainer: "CueMol Project <info@cuemol.org>"
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  category: Education
  # No role word on either: an AppImage IS the application, and a .deb is a
  # package whose extension already says so. Only dmg and exe, which hand the
  # user something to run before they have the app, carry one. 'x64' overrides
  # the target-native spellings (x86_64 / amd64) so one release uses one word.
  artifactName: ${productName}-${env.CM_FULL_VERSION}-Linux-x64.${ext}
  # Shell association (the Linux analogue of mac.fileAssociations above; keep
  # the three platform lists in sync). electron-builder derives everything from
  # the mimeType fields here:
  #   - the .desktop entry gets a MimeType= line (and its Exec already carries
  #     %U), so file managers list CueMol3 under "Open With";
  #   - a shared-mime-info XML is generated from ext+mimeType+description and,
  #     for the deb, installed to /usr/share/mime/packages/<executable>.xml;
  #     the stock deb after-install then runs update-mime-database and
  #     update-desktop-database (app-builder-lib templates/linux/
  #     after-install.tpl), so the globs resolve right after install.
  # A launched file arrives on argv / second-instance argv, which
  # main/index.ts already parses into the shell-open queue.
  #
  # Like the other two platforms this claims candidacy, not the default:
  # a MimeType listing never overrides the user's mimeapps.list defaults,
  # which is the freedesktop-native form of `rank: Alternate`.
  #
  # One ext per entry, unlike the mac list: the Linux mime-XML generator emits
  # `*.${ext}` verbatim, so an ext ARRAY would produce a broken glob like
  # "*.pdb,ent" (app-builder-lib LinuxTargetHelper.computeMimeTypeFiles).
  # Repeating a mimeType across entries is fine -- shared-mime-info merges the
  # duplicate <mime-type> elements and a duplicate in MimeType= is harmless.
  # chemical/x-* names follow the chemical-mime-data conventions where one
  # exists (pdb / cif / mmcif / mol2 / sdf / mol); the rest are app-scoped
  # x- names, which shared-mime-info also merges if another package defines
  # them. The AppImage carries the same .desktop metadata; whether it is
  # registered is up to the user's integration tool (e.g. AppImageLauncher).
  fileAssociations:
    - ext: qsc
      mimeType: application/x-cuemol-scene
      description: CueMol Scene
    - ext: pdb
      mimeType: chemical/x-pdb
      description: PDB Coordinates
    - ext: ent
      mimeType: chemical/x-pdb
      description: PDB Coordinates
    - ext: cif
      mimeType: chemical/x-cif
      description: mmCIF Coordinates
    - ext: mmcif
      mimeType: chemical/x-mmcif
      description: mmCIF Coordinates
    - ext: mol2
      mimeType: chemical/x-mol2
      description: Sybyl Mol2 Coordinates
    - ext: sdf
      mimeType: chemical/x-mdl-sdfile
      description: MOL/SDF Coordinates
    - ext: mol
      mimeType: chemical/x-mdl-molfile
      description: MOL/SDF Coordinates
    - ext: ccp4
      mimeType: application/x-ccp4-map
      description: CCP4 Density Map
    - ext: map
      mimeType: application/x-ccp4-map
      description: CCP4 Density Map
    - ext: mrc
      mimeType: application/x-ccp4-map
      description: CCP4 Density Map
    - ext: mtz
      mimeType: application/x-mtz
      description: MTZ Structure Factor
    - ext: cns
      mimeType: application/x-xplor-map
      description: XPLOR/CNS Density Map
    - ext: dx
      mimeType: application/x-apbs-potential-map
      description: APBS Potential Map
    - ext: brix
      mimeType: application/x-brix-map
      description: BRIX Density Map
    - ext: omap
      mimeType: application/x-brix-map
      description: BRIX Density Map
