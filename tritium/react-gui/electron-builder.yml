# ==============================================================================
# electron-builder configuration for CueMol3 (macOS arm64 / ad-hoc signed)
# ==============================================================================
#
# Background
# ----------
# This app is a pnpm monorepo. react-gui/ depends on the @cuemol/core workspace
# package, which wraps a C++ native addon (cuemol_internal.node) that links
# against libcuemol2.dylib and Boost dylibs installed at a machine-specific
# path (LIBCUEMOL2_ROOT). Three packaging challenges arise:
#
#   1. Native addon outside node_modules
#      @cuemol/core lives at ../../core/ (monorepo); pnpm symlinks it into
#      react-gui/node_modules/@cuemol/core -> ../../../core.  If it were a
#      production dependency, electron-builder would follow that symlink via
#      fs.realpath and reject files whose real path is outside react-gui/.
#      SOLUTION: @cuemol/core is declared as a *devDependency*, so electron-builder
#      does not walk it.  Its minimal runtime files are staged into
#      packaging/staging/ (by collect-cuemol2-runtime.sh) and mapped to
#      node_modules/ via the files FileSet below.
#
#   2. Relocatable LC_RPATH in cuemol_internal.node
#      At C++ build time cmake sets INSTALL_RPATH "@loader_path/../lib" with
#      BUILD_WITH_INSTALL_RPATH (tritium/core/CMakeLists.txt), so the .node
#      already carries a relocatable rpath that resolves to the dylibs staged
#      beside it -- no post-pack rpath rewrite is needed.  electron-builder
#      applies the deep ad-hoc signature.
#
#   3. sysconfig.xml path baked into cuemol_internal.node
#      DEFAULT_CONFIG is compiled in as an absolute path.  In the packaged app
#      the cuemol2 data tree is copied to Contents/Resources/cuemol2/share/.
#      SOLUTION: main/ipcHandlers.ts (getSysConfigPath, APP_PATH handler)
#      detects app.isPackaged and computes the correct runtime path from
#      process.resourcesPath, then forwards it to the Web Worker via the
#      'apppath' IPC channel.
#
# asar: false
# -----------
# asar is intentionally disabled.  electron-builder's asarUnpack patterns do
# not apply to files contributed via FileSet from/to remapping, so the native
# .node would end up locked inside the asar archive where dyld cannot load it.
# With asar=false all files are laid out directly under Contents/Resources/app/,
# which also makes it easy to inspect the bundle contents for debugging.

appId: org.cuemol.cuemol3
productName: CueMol3
asar: false
nodeGypRebuild: false
npmRebuild: false

directories:
  output: release

# files: what goes into Contents/Resources/app/ inside the .app bundle
#
# The app itself (out/) plus package.json go in directly.
# The monorepo @cuemol/core cannot be referenced as "../core" because
# electron-builder would follow the symlink and error on files outside react-gui/.
# Instead, packaging/package-mac.sh pre-stages the minimal set of runtime files
# into packaging/staging/, and we map that to node_modules/ here.
#
# Staged layout:
#   packaging/staging/
#     @cuemol/core/
#       package.json          <- needed by `bindings` to locate the .node file
#       src/index.cjs         <- CJS entry; loaded by require("@cuemol/core")
#       build/Release/
#         cuemol_internal.node
#     bindings/               <- runtime dep of @cuemol/core
#     file-uri-to-path/       <- runtime dep of bindings
files:
  - out/**/*
  - package.json
  - from: packaging/staging
    to: node_modules
    filter:
      - "**/*"

# extraResources: the cuemol2 data tree (share/ only)
#
# dylibs are no longer placed here.  Instead, cmake post-build copies them to
# core/build/lib/, and collect-cuemol2-runtime.sh stages them into
# packaging/staging/@cuemol/core/build/lib/.  electron-builder then places them
# at Contents/Resources/app/node_modules/@cuemol/core/build/lib/, which is
# exactly where the @loader_path/../lib rpath in cuemol_internal.node resolves.
#
# Only sysconfig.xml and the data tree need to be in cuemol2/share/;
# main/ipcHandlers.ts computes this path via process.resourcesPath when packaged.
#
# .app bundle layout (relevant parts):
#   Contents/
#     Resources/
#       app/
#         node_modules/@cuemol/core/build/
#           Release/cuemol_internal.node
#           lib/libcuemol2.dylib, libboost_*.dylib
#       cuemol2/
#         share/
#           sysconfig.xml
#           data/
#           ...
extraResources:
  - from: packaging/cuemol2-runtime/share
    to: cuemol2/share
    filter:
      - "**/*"

mac:
  # arm64 DMG only (matches host build of libcuemol2.dylib)
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.education
  # identity: "-" -> ad-hoc signing (codesign --sign -).
  # The rpath in cuemol_internal.node is already correct (@loader_path/../lib)
  # because cmake sets it at build time, so no afterPack rpath manipulation is
  # needed.  electron-builder handles the deep ad-hoc signature here.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
